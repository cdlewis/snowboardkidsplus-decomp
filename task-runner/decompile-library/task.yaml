candidate_source: python3 tools/task_candidates.py decompile-library
prompt: >-
  Decompile the PSY-Q library function $INPUT in src/syslib/. Follow AGENTS.md
  and the repo-local .agents/skills/psx-match-function/SKILL.md workflow. Start
  with a green ./tools/build-and-verify.sh, locate the live INCLUDE_ASM, and
  inspect the regenerated target assembly, callers, and existing declarations.
  Create the workspace with ./tools/codex --bootstrap-only --id $TASK_ID $INPUT.
  Before inventing an implementation, search these three local SDK source
  libraries for the target function and related routines:
    * PsyZ at ../psyz/decomp;
    * Symphony of the Night at ../sotn-decomp;
    * Tomba at ../psx_tomba; and
    * psy-q-decomp at ../psy-q-decomp.
  Paths are relative to this repository root. This game's linked SDK might be PSY-Q 4.2, so compare several
  implementations against the actual assembly instead of assuming a reference
  matches. See README.md's Local SDK references section for further sources
  and preserve applicable license notices. Run
  python3 tools/rank_library_functions.py --limit 20 for matched local C
  references. Check function behavior, argument types, struct layouts, and the
  complete owning unit. Use meaningful C and existing SDK macros; do not copy
  inline assembly, fixed register bindings, or raw struct-offset accesses.
  SDK units may use separate verified compiler settings; preserve logical
  modules and verify all affected functions and owned data. Keep useful
  attempts, obey tool stop instructions, and only integrate exact C. Run
  ./tools/build-and-verify.sh --expected --objects before declaring a match.
  The task runner handles committing successful work.
agent: codex
success_command: 'git add -A && git commit -m "matched library function $CANDIDATE"'
timeout: 20m
