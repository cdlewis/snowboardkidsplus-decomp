candidate_source: python3 tools/task_candidates.py decompile-similar
prompt: >-
  Decompile the function $INPUT. Follow AGENTS.md and the repo-local
  .agents/skills/psx-match-function/SKILL.md workflow. Create the workspace with
  ./tools/codex --bootstrap-only --references --id $TASK_ID $INPUT.
  Use the source, archived attempt, and ranked C references in its summary.
  Structural similarity does not establish function identity or a byte match.
  Consider the purpose of the function and compare its assembly with the
  references. Start with any existing inline C in the owning source file.
  Preserve useful attempts and obey tool stop instructions. If the best attempt matches,
  integrate it normally and verify with
  ./tools/build-and-verify.sh --expected --objects before declaring a match.
  If matching stops short, integrate the best usable measured C from the
  archived attempt in the owning source file under #ifdef NON_MATCHING.
  Keep the existing INCLUDE_ASM in the #else branch. Put the structured
  comment /* DECOMP_ATTEMPT: inline MATCHING_WORDS/COMPARED_WORDS */ immediately
  above #ifdef NON_MATCHING, replacing the placeholders with the measured counts.
  For an exact integration, remove the fallback and its annotation.
  Preserve any existing better inline attempt. Keep associated declarations
  and candidate-only data scoped so both build modes compile.
  Run ./tools/build-and-verify.sh --expected --objects --non-matching to verify
  the default executable and compile the partial C comparison objects.
  Commit verified exact or annotated partial C yourself using the tracked
  validation hook and include the commit hash in your final report. If no usable
  measured implementation can be integrated, preserve the scratch attempts
  and report the blocker.
agent: codex
accept_best_effort: true
success_command: >-
  function_name=$CANDIDATE &&
  ./tools/build-and-verify.sh --expected --objects --non-matching &&
  ./tools/install-git-hooks.sh &&
  git add -A && git commit -m "Decompilation work on $function_name"
timeout: 180m
