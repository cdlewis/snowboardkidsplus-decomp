name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout encrypted disc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cdlewis/snowboardkidsplus-private
          ref: ebe2078df43326c4920350f418df8078480f8829
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          path: baserom

      - name: Decrypt disc
        env:
          BASEROM_KEY: ${{ secrets.BASEROM_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd baserom
          sha256sum --check SHA256SUMS
          cat baserom.zip.gpg.part-* > "$RUNNER_TEMP/baserom.zip.gpg"
          trap 'rm -f "$RUNNER_TEMP/baserom.zip" "$RUNNER_TEMP/baserom.zip.gpg"' EXIT
          printf '%s' "$BASEROM_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --output "$RUNNER_TEMP/baserom.zip" \
            --decrypt "$RUNNER_TEMP/baserom.zip.gpg"
          cd "$GITHUB_WORKSPACE"
          unzip -q "$RUNNER_TEMP/baserom.zip" \
            'Snobow Kids Plus (Japan)/Snobow Kids Plus (Japan).bin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install pycdlib 'splat64[mips]' 'mapfile-parser>=2.13.2,<3'

      - name: Install PSX compilers
        run: python tools/fetch-gcc.py

      - name: Fetch SDK converter
        run: .venv/bin/python tools/psyq_sdk.py --fetch

      - name: Verify executable and generate progress docs
        run: ./tools/build-and-verify.sh --jobs 2 --objects --non-matching --docs

      - name: Upload progress report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jp_report
          path: build/report.json
          if-no-files-found: error

      - name: Upload progress site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Update progress badges and docs
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/update_badges.py
          git add README.md docs/index.html
          if git diff --cached --quiet -- README.md docs/index.html; then
            echo 'Progress badges and docs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./tools/install-git-hooks.sh
          git commit -m 'Update decompilation progress'
          gh auth setup-git
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main advanced during the build; its next build will update progress.'
            exit 0
          fi
          # GITHUB_TOKEN pushes do not trigger another build workflow.
          git push origin HEAD:main

      - name: Remove disc data
        if: always()
        run: rm -rf baserom disc 'Snobow Kids Plus (Japan)'

  publish-docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish progress docs
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Purge Cloudflare cache for progress docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ZONE_ID:?Missing CLOUDFLARE_ZONE_ID secret}"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"prefixes":["chrislewis.au/snowboardkidsplus-decomp"]}' \
            | jq -e '.success == true'
