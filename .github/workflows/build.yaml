name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout encrypted disc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cdlewis/snowboardkidsplus-private
          ref: ebe2078df43326c4920350f418df8078480f8829
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          path: baserom

      - name: Decrypt disc
        env:
          BASEROM_KEY: ${{ secrets.BASEROM_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd baserom
          sha256sum --check SHA256SUMS
          cat baserom.zip.gpg.part-* > "$RUNNER_TEMP/baserom.zip.gpg"
          trap 'rm -f "$RUNNER_TEMP/baserom.zip" "$RUNNER_TEMP/baserom.zip.gpg"' EXIT
          printf '%s' "$BASEROM_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --output "$RUNNER_TEMP/baserom.zip" \
            --decrypt "$RUNNER_TEMP/baserom.zip.gpg"
          cd "$GITHUB_WORKSPACE"
          unzip -q "$RUNNER_TEMP/baserom.zip" \
            'Snobow Kids Plus (Japan)/Snobow Kids Plus (Japan).bin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install pycdlib 'splat64[mips]' 'mapfile-parser>=2.13.2,<3'

      - name: Install PSX compilers
        run: python tools/fetch-gcc.py

      - name: Fetch SDK converter
        run: .venv/bin/python tools/psyq_sdk.py --fetch

      - name: Build and verify executable
        run: ./tools/build-and-verify.sh --jobs 2

      - name: Upload progress report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jp_report
          path: build/report.json
          if-no-files-found: error

      - name: Update README progress badges
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/update_badges.py
          if git diff --quiet -- README.md; then
            echo 'README badges are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./tools/install-git-hooks.sh
          git add README.md
          git commit -m 'Update README matching percentages'
          gh auth setup-git
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main advanced during the build; its next build will update the badges.'
            exit 0
          fi
          # GITHUB_TOKEN pushes do not trigger another build workflow.
          git push origin HEAD:main

      - name: Remove disc data
        if: always()
        run: rm -rf baserom disc 'Snobow Kids Plus (Japan)'
